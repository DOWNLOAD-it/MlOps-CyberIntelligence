version: '3.8'

services:
  dagster:
    build:
      context: .
      dockerfile: src/Dockerfile
    container_name: dagster_orchestrator
    ports:
      - "${DAGSTER_HOST_PORT:-4301}:3000"
    volumes:
      - .:/app
      - dagster_home:/app/dagster_home
      - mlflow_data:/app/mlruns
    depends_on:
      - redpanda
    environment:
      - PYTHONPATH=/app
      - DAGSTER_HOME=/app/dagster_home
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-redpanda:9092}
      - STREAM_MAX_RECORDS=${STREAM_MAX_RECORDS:-500000}
      - PRODUCER_BATCH_SIZE=${PRODUCER_BATCH_SIZE:-5000}
      - CSV_ENCODING=${CSV_ENCODING:-cp1252}
      - KAFKA_MAX_POLL_RECORDS=${KAFKA_MAX_POLL_RECORDS:-5000}
      - KAFKA_POLL_TIMEOUT_MS=${KAFKA_POLL_TIMEOUT_MS:-5000}
      - KAFKA_IDLE_POLLS_LIMIT=${KAFKA_IDLE_POLLS_LIMIT:-5}
      - KAFKA_IDLE_TIMEOUT_S=${KAFKA_IDLE_TIMEOUT_S:-120}
      - EXPORT_APPEND=${EXPORT_APPEND:-false}
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      # ML Hyperparameters
      - ML_N_ESTIMATORS=${ML_N_ESTIMATORS:-200}
      - ML_CONTAMINATION=${ML_CONTAMINATION:-0.1}
      - PRODUCER_CHUNK_STRIDE=${PRODUCER_CHUNK_STRIDE:-1}
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000"]

  dagster-daemon:
    build:
      context: .
      dockerfile: src/Dockerfile
    container_name: dagster_daemon
    volumes:
      - .:/app
      - dagster_home:/app/dagster_home
      - mlflow_data:/app/mlruns
    depends_on:
      - dagster
    environment:
      - PYTHONPATH=/app
      - DAGSTER_HOME=/app/dagster_home
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-redpanda:9092}
      - STREAM_MAX_RECORDS=${STREAM_MAX_RECORDS:-500000}
      - PRODUCER_BATCH_SIZE=${PRODUCER_BATCH_SIZE:-5000}
      - CSV_ENCODING=${CSV_ENCODING:-cp1252}
      - KAFKA_MAX_POLL_RECORDS=${KAFKA_MAX_POLL_RECORDS:-5000}
      - KAFKA_POLL_TIMEOUT_MS=${KAFKA_POLL_TIMEOUT_MS:-5000}
      - KAFKA_IDLE_POLLS_LIMIT=${KAFKA_IDLE_POLLS_LIMIT:-5}
      - KAFKA_IDLE_TIMEOUT_S=${KAFKA_IDLE_TIMEOUT_S:-120}
      - EXPORT_APPEND=${EXPORT_APPEND:-false}
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      # ML Hyperparameters
      - ML_N_ESTIMATORS=${ML_N_ESTIMATORS:-200}
      - ML_CONTAMINATION=${ML_CONTAMINATION:-0.1}
      - PRODUCER_CHUNK_STRIDE=${PRODUCER_CHUNK_STRIDE:-1}
    command: ["dagster-daemon", "run"]

  dbt:
    build:
      context: .
      dockerfile: src/Dockerfile
    container_name: dbt_runner
    working_dir: /app/dbt_project
    depends_on:
      - dagster
    command: ["dbt", "run", "--profiles-dir", "/app/dbt_project"]

  redpanda:
    image: redpandadata/redpanda:v24.1.1
    container_name: redpanda
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:${REDPANDA_KAFKA_PORT:-4305}
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://${REDPANDA_ADVERTISE_HOST:-redpanda}:${REDPANDA_KAFKA_PORT:-4305}
      - --pandaproxy-addr 0.0.0.0:${REDPANDA_PROXY_PORT:-4304}
      - --advertise-pandaproxy-addr ${REDPANDA_ADVERTISE_HOST:-redpanda}:${REDPANDA_PROXY_PORT:-4304}
    ports:
      - "${REDPANDA_ADMIN_PORT:-4303}:8081"
      - "${REDPANDA_PROXY_PORT:-4304}:8082"
      - "${REDPANDA_KAFKA_PORT:-4305}:9092"
      - "${REDPANDA_INTERNAL_PORT:-4306}:29092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data


  mlflow:
    build:
      context: .
      dockerfile: src/Dockerfile
    container_name: mlflow_server
    ports:
      - "${MLFLOW_HOST_PORT:-4302}:5000"
    volumes:
      - .:/app
      - mlflow_data:/app/mlruns
    environment:
      - PYTHONPATH=/app
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "sqlite:///app/mlflow.db", "--default-artifact-root", "/app/mlruns", "--allowed-hosts", "*"]

volumes:
  redpanda_data:
  dagster_home:
  mlflow_data: