name: Deploy to Komodo

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Komodo Deployment
        run: |
          echo "Triggering deployment on Komodo server..."
          
          # Validate secrets are set
          if [ -z "${{ secrets.KOMODO_WEBHOOK_URL }}" ]; then 
            echo "Error: KOMODO_WEBHOOK_URL secret is not set" 
            exit 1 
          fi 
          
          if [ -z "${{ secrets.KOMODO_WEBHOOK_SECRET }}" ]; then 
            echo "Error: KOMODO_WEBHOOK_SECRET secret is not set" 
            exit 1 
          fi
          
          # Use the authentic GitHub event payload file
          SECRET="${{ secrets.KOMODO_WEBHOOK_SECRET }}"
          
          # Sign the exact bytes of the file
          SIGNATURE="sha256=$(openssl dgst -sha256 -hmac "$SECRET" $GITHUB_EVENT_PATH | sed -e 's/^.* //')"
          
          # Forward the exact payload file with the perfect signature
          curl -X POST "${{ secrets.KOMODO_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: $SIGNATURE" \
            --data-binary @"$GITHUB_EVENT_PATH"
