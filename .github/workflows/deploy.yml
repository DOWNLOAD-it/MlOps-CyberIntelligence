name: Deploy to Komodo

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Komodo Deployment
        run: |
          echo "Triggering deployment on Komodo server..."
          
          # Komodo expects a valid GitHub payload to verify the branch
          PAYLOAD='{"ref": "refs/heads/develop"}'
          
          # Generate the HMAC SHA-256 signature (required by Komodo)
          SECRET="${{ secrets.KOMODO_WEBHOOK_SECRET }}"
          SIGNATURE="sha256=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$SECRET" | sed -e 's/^.* //')"
          
          # Send the request with the correct headers
          curl -X POST "${{ secrets.KOMODO_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: $SIGNATURE" \
            -d "$PAYLOAD"
