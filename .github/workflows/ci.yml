name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Pytest
        run: |
          pytest tests/ -v

      - name: Verify Python compilation
        run: |
          python -m py_compile src/streaming/producer.py
          python -m py_compile src/streaming/cleaner.py
          python -m py_compile src/streaming/inference.py
          python -m py_compile src/orchestration/assets.py
          python -m py_compile src/orchestration/definitions.py
          python -m py_compile src/quality/data_quality.py
          python -m py_compile src/ml/train.py
          python -m py_compile src/ml/predict.py

      - name: Build Docker Image
        run: |
          docker build -t mlsecops-platform:${{ github.sha }} -f src/Dockerfile .

  deploy:
    needs: test-and-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Komodo Deployment
        run: |
          echo "Triggering deployment on Komodo server..."
          
          # Validate secrets are set
          if [ -z "${{ secrets.KOMODO_WEBHOOK_URL }}" ]; then 
            echo "Error: KOMODO_WEBHOOK_URL secret is not set" 
            exit 1 
          fi 
          
          if [ -z "${{ secrets.KOMODO_WEBHOOK_SECRET }}" ]; then 
            echo "Error: KOMODO_WEBHOOK_SECRET secret is not set" 
            exit 1 
          fi
          
          # Use the authentic GitHub event payload file
          SECRET="${{ secrets.KOMODO_WEBHOOK_SECRET }}"
          
          # Sign the exact bytes of the file
          SIGNATURE="sha256=$(openssl dgst -sha256 -hmac "$SECRET" $GITHUB_EVENT_PATH | sed -e 's/^.* //')"
          
          # Forward the exact payload file with the perfect signature
          curl -X POST "${{ secrets.KOMODO_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: $SIGNATURE" \
            --data-binary @"$GITHUB_EVENT_PATH"
